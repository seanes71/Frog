<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#217b40"><meta name="description" content="Pick your frog fighter, match cards, and explore your Frog Journey."><title>Frog Showdown · Mobile</title><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css?v=full-frogs-2"></head><body>
<main id="app" class="pond-shell">
<header class="topbar"><button class="avatar" data-action="fighters" aria-label="Choose your frog fighter">🐸</button><span class="wallet" aria-label="Frog currency">🐸 <b id="bank">20</b></span><button class="gear" data-action="settings" aria-label="Settings">⚙</button></header>
<section id="home" class="screen home-screen"><h1 class="game-logo"><span>FROG</span><strong>SHOWDOWN</strong></h1><div class="hero-space pond-showdown"></div><div class="home-actions"><div class="home-picks"><button class="cream selector" data-action="fighters"><span class="selected-avatar">🐸</span><span>Pick A Player<small id="selected-name">Green Hopper</small></span></button><button class="cream selector compact-powers" data-action="powers"><span aria-hidden="true">⭐</span><span>Pick Your Super Powers</span></button></div><button class="play-button" data-action="play">RIVAL PLAY <span aria-hidden="true">▶</span></button><button class="solo-main" data-action="practice">Solo Play <small>No opponent · No timer</small></button><button class="explore-main" data-action="explore">🌿 Explore the Pond <small>Word puzzles & nature discoveries</small></button><button class="league-preview cream" data-action="leagues"><span>🥚</span><div><b id="league-name">Your Frog Journey</b><small id="league-next">Eggs: A New Beginning</small><span class="meter"><i id="league-bar"></i></span></div></button></div></section>
<section id="hub" class="screen hub-screen" hidden><div class="page-heading"><button class="back" data-action="home" aria-label="Back home">‹</button><h2 id="hub-title">Fighters</h2></div><div id="hub-content"></div></section>
<section id="game" class="screen game-screen" hidden><div class="game-header"><button class="back" data-action="leave" aria-label="Leave match">‹ Home</button><span id="mode-label">Rival showdown</span><button class="gear" data-action="rules" aria-label="How to play">?</button></div><div class="scoreboard"><div><span id="you-name">You</span><strong id="you-score">0</strong></div><div class="clock"><b id="timer">15</b><small id="series-score">Round 1 · Best of 3</small></div><div><span id="rival-name">Alex · CPU</span><strong id="rival-score">0</strong></div></div><p id="turn-message" class="turn-message" aria-live="polite">Your turn. Find a pair!</p><div id="board" class="board" aria-label="Matching cards"></div><div id="game-powers" class="game-powers"></div></section>
<nav class="bottom-nav" aria-label="Main navigation"><button data-action="home" class="active"><span>🏠</span>Home</button><button data-action="fighters"><span>🐸</span>Fighters</button><button data-action="powers"><span>⚡</span>Powers</button><button data-action="rewards"><span>🎁</span>Rewards</button></nav>
</main><dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status" hidden></div><dialog id="account-dialog"><h2>Your Frog Account</h2><p>Use your existing account or create one to save progress online. You can also play on this device.</p><label>Email<input id="account-email" type="email" autocomplete="email"></label><label>Password<input id="account-password" type="password" autocomplete="current-password" minlength="6"></label><p id="account-message" aria-live="polite">Connecting account service…</p><div class="actions"><button class="button" id="account-login">Log In</button><button class="button secondary" id="account-create">Create Account</button><button class="button secondary" id="account-logout" hidden>Log Out</button><button class="button secondary" id="account-close">Back to Game</button></div></dialog><div class="account-loading-message" role="status">Loading your saved frog progress…</div><script type="module" src="app.js?v=pond-audio-3"></script><script type="module" src="account.js?v=mobile-1"></script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});</script></body></html>
