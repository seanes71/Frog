<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Froggy Faceoff · Playable Design Preview</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:#163c32;color:#fff}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #fff;outline-offset:3px}.app{max-width:520px;min-height:100dvh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#0b364b44,#0e553c88),url("assets/pond-scenery-v1.png") center top/100% auto repeat-y;box-shadow:0 0 50px #071c1c;padding:18px 16px 34px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{background:#174d46c9;border:2px solid #b9e5a7;border-radius:16px;padding:9px 12px;font-weight:800;font-size:13px}.title{text-align:center;margin:25px 0 8px;font-size:clamp(33px,9vw,49px);line-height:1.06;color:#fff4ae;text-shadow:0 4px 0 #694d2b,0 7px 15px #091e18;-webkit-text-stroke:.6px #4b4628}.sub{text-align:center;font-weight:800;text-shadow:0 2px 4px #123;margin:0 0 18px}.stage{border:4px solid #e6c78c;background:linear-gradient(180deg,#7baf9abb,#184e42ee);border-radius:26px;padding:15px 12px 18px;box-shadow:0 8px 0 #473f27,0 14px 22px #061b1d88}.stage h2{text-align:center;margin:0 0 10px;color:#fff4bd;font-size:19px}.cast{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.frog{border:3px solid #9cc8a2;background:linear-gradient(#dff7d9,#8bbf9d);border-radius:17px;padding:7px 2px 5px;color:#224d36;min-height:110px;box-shadow:0 4px 0 #285942;transition:transform .15s}.frog.selected{border-color:#ffdb57;background:linear-gradient(#fff4c3,#ffd06b);transform:translateY(-3px);box-shadow:0 6px 0 #a4752c}.frog svg{width:100%;height:71px;display:block}.frog b{display:block;font-size:12px}.selected-text{text-align:center;margin:13px 0 0;font-size:14px;font-weight:800}.cta{display:block;width:100%;margin:18px 0 0;padding:15px;border-radius:18px;border:3px solid #fff3b0;background:linear-gradient(#ffe58c,#efa83c);color:#4b321b;font-size:20px;font-weight:900;box-shadow:0 5px 0 #9d6526}.games{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:22px 0}.games button{padding:15px 8px;min-height:68px;border-radius:17px;border:3px solid #e7e9b4;background:linear-gradient(#4c9b6c,#226144);color:white;font-weight:900;text-shadow:0 2px #234;font-size:15px}.games button:nth-child(2n){background:linear-gradient(#518dc0,#315d9d)}.notice{text-align:center;font-size:12px;color:#e4f6e8;line-height:1.5}.back{background:#214e42;border:2px solid #bfe5b8;border-radius:12px;padding:10px;color:white;font-weight:800}.panel{display:none}.panel.active{display:block}.panel h2{text-align:center;color:#fff1aa}.cardgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.card{aspect-ratio:3/4;border:3px solid #f5d78d;border-radius:13px;background:linear-gradient(#4784a2,#26586c);color:white;font-size:38px;font-weight:900}.card.open,.card.done{background:#f3f4d1;color:#224}.card.done{opacity:.6}.status{text-align:center;font-weight:800;margin:15px 0}.result{padding:20px;text-align:center;background:#154b41dd;border:3px solid #d8c184;border-radius:18px}.small{font-size:13px}.scene{height:230px;border:4px solid #f4da97;border-radius:20px;background:linear-gradient(#86d6ed 0 48%,#5eaa7a 49% 66%,#2c9a9b 67%);position:relative;overflow:hidden;margin:15px 0}.scene .item{position:absolute;font-size:48px;filter:drop-shadow(1px 3px 1px #244)}.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.pads button{height:80px;background:#6fa94b;border:4px solid #bce280;border-radius:50%;font-size:38px}.pads button.flash{background:#ffde66}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.answers button{padding:18px 6px;background:#d7efc3;color:#214d32;border:3px solid #88b472;border-radius:14px;font-weight:900;font-size:21px}@media(max-width:360px){.frog{min-height:99px}.frog svg{height:60px}.frog b{font-size:11px}.cast{gap:5px}}
</style></head><body><main class="app"><div class="top"><span class="tag">🐸 Froggy Faceoff</span><span class="tag">✨ Design test · No saved progress</span></div><section id="home" class="panel active"><h1 class="title">Froggy<br>Faceoff</h1><p class="sub">A pond full of personality!</p><div class="stage"><h2>🌸 Meet Your Pond Friends</h2><div id="cast" class="cast"></div><p class="selected-text" id="chosen"></p><button class="cta" id="pick">Pick A Player</button></div><div class="games"><button data-open="memory">🃏 Pond Memory</button><button data-open="numbers">🔢 Number Challenge</button><button data-open="changed">🌿 What Changed?</button><button data-open="follow">🐸 Follow That Frog!</button><button data-open="info">🧩 Crossword & Word Search</button><button data-open="info">🌱 Explore Pond & Frog Journey</button></div><p class="notice">Standalone interactive preview. Your original Froggy Faceoff and its saved progress are untouched.</p></section><section id="game" class="panel"><button class="back" id="back">← Home</button><h2 id="game-title"></h2><div id="game-content"></div></section></main><script>
const names=['Ribbit','Lily','Splash','Poppy','Goldie','Blaze','Sage','Nova'],colors=['#6bc34e','#ec90bc','#67b9ee','#f39d5c','#edc856','#ed7660','#7dcba7','#9d85df'];let chosen=0,mode='',deck=[],opened=[],matched=0,turns=0,level=0,seq=[],input=[],locked=false,changedIdx=0;
function art(i){const c=colors[i];return `<svg viewBox="0 0 100 105" role="img" aria-label="${names[i]} frog"><ellipse cx="50" cy="92" rx="35" ry="9" fill="#254c36" opacity=".2"/><path d="M30 76 Q10 74 12 91 Q23 99 41 86 M70 76 Q90 74 88 91 Q77 99 59 86" fill="${c}" stroke="#456c46" stroke-width="3"/><ellipse cx="50" cy="67" rx="28" ry="26" fill="${c}" stroke="#456c46" stroke-width="2.5"/><ellipse cx="50" cy="73" rx="18" ry="16" fill="#ffffff" opacity=".28"/><path d="M27 58 Q13 64 21 80 M73 58 Q87 64 79 80" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round"/><ellipse cx="50" cy="36" rx="37" ry="32" fill="${c}" stroke="#456c46" stroke-width="2.5"/><ellipse cx="28" cy="13" rx="15" ry="16" fill="${c}" stroke="#456c46" stroke-width="2"/><ellipse cx="72" cy="13" rx="15" ry="16" fill="${c}" stroke="#456c46" stroke-width="2"/><ellipse cx="28" cy="17" rx="9" ry="11" fill="white"/><ellipse cx="72" cy="17" rx="9" ry="11" fill="white"/><ellipse cx="30" cy="18" rx="4" ry="7" fill="#233b39"/><ellipse cx="70" cy="18" rx="4" ry="7" fill="#233b39"/><circle cx="31" cy="16" r="2" fill="white"/><circle cx="71" cy="16" r="2" fill="white"/><ellipse cx="24" cy="44" rx="9" ry="5" fill="#e67c91" opacity=".55"/><ellipse cx="76" cy="44" rx="9" ry="5" fill="#e67c91" opacity=".55"/><path d="M36 49 Q50 ${i===6?54:69} 64 49" stroke="#385044" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="43" cy="42" r="2" fill="#46664e"/><circle cx="57" cy="42" r="2" fill="#46664e"/>${i===4?'<path d="M28 1 L38 -9 L50 0 L62 -9 L72 1" fill="#f8d66a" stroke="#ab8331" stroke-width="3"/>':''}${i===7?'<path d="M19 5 Q50 -18 81 5" fill="none" stroke="#eee1ff" stroke-width="6"/>':''}</svg>`}
function renderCast(){document.getElementById('cast').innerHTML=names.map((n,i)=>`<button class="frog ${chosen===i?'selected':''}" data-frog="${i}">${art(i)}<b>${n}</b></button>`).join('');document.getElementById('chosen').textContent=`Your player: ${names[chosen]} 💚`}
document.getElementById('cast').onclick=e=>{const b=e.target.closest('[data-frog]');if(b){chosen=+b.dataset.frog;renderCast()}};document.getElementById('pick').onclick=()=>{document.getElementById('chosen').textContent=`${names[chosen]} is ready to play! Choose a game below. 🎉`;document.querySelector('.games').scrollIntoView({behavior:'smooth',block:'center'})};
document.querySelector('.games').onclick=e=>{const b=e.target.closest('[data-open]');if(b)openGame(b.dataset.open)};document.getElementById('back').onclick=()=>{document.getElementById('game').classList.remove('active');document.getElementById('home').classList.add('active');scrollTo(0,0)};
const box=()=>document.getElementById('game-content');function openGame(m){mode=m;document.getElementById('home').classList.remove('active');document.getElementById('game').classList.add('active');document.getElementById('game-title').textContent=({memory:'Pond Memory',numbers:'Froggy Number Challenge',changed:'What Changed at the Pond?',follow:'Follow That Frog!',info:'More Pond Adventures'})[m];scrollTo(0,0);start()}
function start(){if(mode==='memory')memory();else if(mode==='numbers')numbers();else if(mode==='changed')changed();else if(mode==='follow')follow();else box().innerHTML='<div class="result">Your original Crossword, Word Search, Frog Journey, Explore Pond, Solo Play and Rival Play remain in your existing game. This preview does not replace them.<button class="cta" onclick="location.href=\'index.html\'">Open Original Game</button></div>'}
function memory(){const icons=['🐸','🪷','🐢','🦋','🐟','🍄'];deck=[...icons,...icons].sort(()=>Math.random()-.5);opened=[];matched=0;turns=0;locked=false;drawMemory()}
function drawMemory(){box().innerHTML=`<p class="status">Find the matching pairs · ${matched/2} of 6 pairs · ${turns} tries</p><div class="cardgrid">${deck.map((v,i)=>`<button class="card ${opened.includes(i)?'open':''}" data-card="${i}">${opened.includes(i)?v:'✿'}</button>`).join('')}</div><p class="notice">Tap two cards to reveal their pictures.</p>`;box().querySelector('.cardgrid').onclick=e=>{const b=e.target.closest('[data-card]');if(!b||locked)return;const i=+b.dataset.card;if(opened.includes(i))return;opened.push(i);b.classList.add('open');b.textContent=deck[i];if(opened.length%2===0){turns++;const a=opened[opened.length-2];if(deck[a]===deck[i]){matched+=2;if(matched===12){setTimeout(()=>win('You found every pair!'),450)}else setTimeout(drawMemory,400)}else{locked=true;setTimeout(()=>{opened=opened.filter(v=>v!==a&&v!==i);locked=false;drawMemory()},950)}}}}
function win(msg){box().innerHTML=`<div class="result"><h2>🎉 Great job, ${names[chosen]}!</h2><p>${msg}</p><button class="cta" id="again">Play Again</button></div>`;document.getElementById('again').onclick=start}
function numbers(){const a=1+Math.floor(Math.random()*9),d=1+Math.floor(Math.random()*5),k=Math.floor(Math.random()*4)+1,correct=a+d*k;const vals=[a,a+d,a+2*d,a+3*d,a+4*d].map((n,i)=>i===k?'?':n);let opts=[correct,correct+d,Math.max(0,correct-d)].sort(()=>Math.random()-.5);box().innerHTML=`<p class="status">Which number is missing?</p><div class="result" style="font-size:25px;font-weight:900;letter-spacing:2px">${vals.join(' · ')}</div><div class="answers" style="margin-top:18px">${opts.map(n=>`<button data-num="${n}">${n}</button>`).join('')}</div>`;box().querySelector('.answers').onclick=e=>{const b=e.target.closest('[data-num]');if(b){if(+b.dataset.num===correct)win('You solved the number pattern!');else{b.disabled=true;b.textContent='Try again'}}}}
function changed(){changedIdx=Math.floor(Math.random()*4);const things=['🦋','🐢','🪷','🐸'];box().innerHTML=`<p class="status">Study the pond carefully!</p><div class="scene" id="scene">${things.map((x,i)=>`<span class="item" style="left:${12+i*23}%;top:${i%2?50:23}%">${x}</span>`).join('')}</div><button class="cta" id="ready">I'm Ready!</button>`;document.getElementById('ready').onclick=()=>{box().innerHTML=`<p class="status">Which pond visitor disappeared?</p><div class="scene">${things.map((x,i)=>i===changedIdx?'':`<span class="item" style="left:${12+i*23}%;top:${i%2?50:23}%">${x}</span>`).join('')}</div><div class="answers">${things.map((x,i)=>`<button data-answer="${i}">${x}</button>`).join('')}</div>`;box().querySelector('.answers').onclick=e=>{const b=e.target.closest('[data-answer]');if(b){if(+b.dataset.answer===changedIdx)win('You spotted what changed!');else{b.disabled=true;b.textContent='Try again'}}}}}
function follow(){seq=Array.from({length:3+Math.floor(Math.random()*2)},()=>Math.floor(Math.random()*3));input=[];locked=true;box().innerHTML='<p class="status" id="prompt">Watch the lily pads light up!</p><div class="pads"><button data-pad="0">🪷</button><button data-pad="1">🪷</button><button data-pad="2">🪷</button></div>';const pads=[...box().querySelectorAll('[data-pad]')];pads.forEach(b=>b.onclick=()=>{if(locked)return;const n=+b.dataset.pad;input.push(n);b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),250);if(seq[input.length-1]!==n){document.getElementById('prompt').textContent='Not quite! Watch again.';setTimeout(follow,850)}else if(input.length===seq.length)win('You remembered the whole sequence!')});seq.forEach((n,i)=>setTimeout(()=>{pads[n]?.classList.add('flash');setTimeout(()=>pads[n]?.classList.remove('flash'),520)},700+i*850));setTimeout(()=>{locked=false;document.getElementById('prompt').textContent='Your turn! Repeat the pattern.'},800+seq.length*850)}
renderCast();
</script></body></html>
