<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pond Animal Test · Frog</title><style>*{box-sizing:border-box}body{margin:0;background:#d6f4f1;color:#163b35;font-family:system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:14px}h1{font-size:clamp(24px,5vw,36px);margin:8px 0}p{margin:6px 0 12px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}button{cursor:pointer;font:inherit}#next{border:0;border-radius:14px;background:#117b57;color:white;padding:13px 19px;font-weight:800}.clue{font-weight:800;font-size:19px}.scene{width:100%;aspect-ratio:1.43;position:relative;background:#72b8a0 url('assets/IMG_4108.jpeg') center/cover no-repeat;overflow:hidden;border:5px solid #fff;border-radius:19px;box-shadow:0 8px 30px #28584844}.creature{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;width:clamp(39px,8.5vw,86px);height:clamp(39px,8.5vw,86px);display:grid;place-items:center;filter:drop-shadow(0 2px 2px #243d2e66);transition:left .35s,top .35s}.creature img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.creature:focus-visible{outline:3px solid #fff;border-radius:8px}.creature.found{opacity:.35;pointer-events:none}.status{min-height:30px;font-weight:700}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:9px;margin:14px 0}.tile{background:white;border-radius:12px;padding:6px;text-align:center;font-size:11px}.tile img{height:74px;width:100%;object-fit:contain}.notice{font-size:13px;color:#345} @media(max-width:500px){main{padding:9px}.scene{aspect-ratio:1/1.12}.creature{width:clamp(40px,12vw,65px);height:clamp(40px,12vw,65px)}}</style></head><body><main><h1>🐸 Pond Animal Test</h1><p>Separate preview only. Your original game is unchanged.</p><div class="controls"><button id="next">New hiding places ↻</button><span class="clue" id="clue"></span></div><div class="scene" id="scene" aria-label="Pond with hidden animals"></div><p class="status" id="status" aria-live="polite"></p><p class="notice">Tap the animal named above. All images below are the actual files uploaded to GitHub. Check that no white rectangles appear.</p><div class="gallery" id="gallery"></div></main><script>const animals=[{"name":"Big Frog","src":"assets/IMG_4154.png","type":"shore"},{"name":"Small Frog","src":"assets/IMG_4155.png","type":"shore"},{"name":"Turtle","src":"assets/IMG_4156.png","type":"shore"},{"name":"Duckling","src":"assets/IMG_4157.png","type":"shore"},{"name":"Mallard","src":"assets/IMG_4158.png","type":"shore"},{"name":"Goldfish","src":"assets/IMG_4159.png","type":"water"},{"name":"Pink Butterfly","src":"assets/IMG_4160.png","type":"air"},{"name":"Orange Butterfly","src":"assets/IMG_4161.png","type":"air"},{"name":"Bee","src":"assets/IMG_4162.png","type":"air"},{"name":"Ladybug","src":"assets/IMG_4163.png","type":"air"},{"name":"Dragonfly","src":"assets/IMG_4164.png","type":"air"},{"name":"Cardinal","src":"assets/IMG_4165.png","type":"tree"},{"name":"Blue Jay","src":"assets/IMG_4166.png","type":"tree"},{"name":"Squirrel","src":"assets/IMG_4167.png","type":"land"},{"name":"Fox","src":"assets/IMG_4168.png","type":"land"},{"name":"Raccoon","src":"assets/IMG_4169.png","type":"land"},{"name":"Fawn","src":"assets/IMG_4170.png","type":"land"},{"name":"Heron","src":"assets/IMG_4171.png","type":"tree"}];const scene=document.getElementById('scene'),clue=document.getElementById('clue'),status=document.getElementById('status');let selected=[],target=0,round=0;const spots={water:[[27,78],[43,81],[61,82],[76,79]],shore:[[20,68],[37,74],[60,72],[79,72]],air:[[17,40],[33,48],[61,40],[78,45]],tree:[[17,25],[32,33],[72,30],[82,28]],land:[[15,63],[32,66],[70,64],[83,62]]};function start(){round++;scene.innerHTML='';selected=[...animals].sort(()=>Math.random()-.5).slice(0,Math.min(6,4+Math.floor(round/3)));target=0;let used=[];selected.forEach((a,i)=>{const positions=[...(spots[a.type]||spots.land)].sort(()=>Math.random()-.5);const p=positions.find(p=>used.every(q=>Math.hypot(p[0]-q[0],p[1]-q[1])>16))||positions[0];used.push(p);const b=document.createElement('button');b.className='creature';b.style.left=p[0]+'%';b.style.top=p[1]+'%';b.setAttribute('aria-label',a.name);const im=document.createElement('img');im.src=a.src;im.alt='';b.append(im);b.addEventListener('click',()=>{if(i!==target){status.textContent='Try again! Find the '+selected[target].name+'.';return}b.classList.add('found');target++;if(target===selected.length){status.textContent='🎉 You found everyone! Starting another round…';clue.textContent='Great job!';setTimeout(start,1800)}else{status.textContent='Great find!';clue.textContent='Find the '+selected[target].name}});scene.append(b)});clue.textContent='Find the '+selected[0].name;status.textContent='Round '+round+' · Tap the animal named above.'}document.getElementById('next').onclick=start;document.getElementById('gallery').innerHTML=animals.map(a=>'<div class="tile"><img src="'+a.src+'" alt="'+a.name+'"><div>'+a.name+'</div></div>').join('');start();</script></body></html>
